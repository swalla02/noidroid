[project]
name = "noidroid"
version = "0.2.0"
description = "Python client for the Paranoid Android trajectory engine."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["noidroid"]
