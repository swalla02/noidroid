name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A newer push to the same branch makes the older run irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install toolchain
        run: rustup component add rustfmt clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets --all-features -- -D warnings

  test:
    name: tests (with browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright anthropic
          echo "PW_VERSION=$(python -m playwright --version | tr ' ' '-')" >> "$GITHUB_ENV"
      - name: Cache the browser
        id: browser-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ env.PW_VERSION }}-chromium
      - name: Install Chromium
        # System packages are not cached, so they install either way; only the
        # browser download is skipped on a hit.
        run: |
          if [ "${{ steps.browser-cache.outputs.cache-hit }}" = "true" ]; then
            python -m playwright install-deps chromium
          else
            python -m playwright install --with-deps chromium
          fi
      - name: Run every test, including the ones that drive a real browser
        run: cargo test --all --verbose -- --nocapture 2>&1 | tee test-output.txt
      - name: Fail if the browser tests silently skipped
        # The browser tests pass when Chromium is missing, by design. On this job it
        # is present, so a skip here would mean the suite is quietly not running.
        run: |
          if grep -q "SKIP: browser adapter test" test-output.txt; then
            echo "::error::browser tests skipped on the job that installs a browser"
            exit 1
          fi
          if grep -q "SKIP: automatic capture test" test-output.txt; then
            echo "::error::auto-capture test skipped on the job that installs the SDK"
            exit 1
          fi

  test-without-browser:
    name: tests (no browser installed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # No Playwright on purpose: the browser tests must skip cleanly rather than
      # fail, so that contributors without Chromium can still run the suite.
      - run: cargo test --all

  test-macos:
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # The engine talks to clients over Unix sockets and spawns real child
      # processes; this job is what backs the claim that it works beyond Linux.
      - run: cargo test --all

  example:
    name: the example actually runs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: cargo build --release
      - name: Record, replay, branch, and check the invariants from the CLI
        run: |
          set -euo pipefail
          export PATH="$PWD/target/release:$PATH"
          export PYTHONPATH="$PWD/clients/python"
          export NO_COLOR=1

          noidroid run -- python3 examples/flight_agent/agent.py
          noidroid replay run-1 | tee replay.txt
          grep -q "faithful:" replay.txt

          before=$(python3 -c "import json;print(json.load(open('.noidroid/trajectories/run-1.json'))['head'])")
          noidroid branch run-1@2 --decide pick_flight=FL-203 \
            --simulate 'payments.charge={"ok":true}' | tee branch.txt
          grep -q "shared with run-1" branch.txt

          after=$(python3 -c "import json;print(json.load(open('.noidroid/trajectories/run-1.json'))['head'])")
          test "$before" = "$after" || { echo "branching mutated its parent"; exit 1; }

          noidroid verify | tee verify.txt
          grep -q "intact:" verify.txt

          # The reference environment: a world that can be re-driven and can never be
          # put back. The release's central claim is that this reconstructs exactly,
          # that a branch reaches a different outcome, and that a checkpoint sitting
          # after an irreversible effect is refused rather than attempted.
          noidroid run --name shift -- python3 examples/reference/agent.py || true
          noidroid replay shift | tee shift-replay.txt
          grep -q "faithful:" shift-replay.txt

          noidroid show shift@8 | tee shift-show.txt
          grep -q "witnessed" shift-show.txt
          grep -q "WHAT THIS CHECKPOINT GUARANTEES" shift-show.txt

          noidroid branch shift@8 --decide move=insert --label saved
          noidroid diff shift saved | tee shift-diff.txt
          grep -q "failure → success" shift-diff.txt
          grep -q "the same objects, not copies" shift-diff.txt

          last=$(python3 -c "import json;print(json.load(open('.noidroid/trajectories/shift.json'))['steps']-1)")
          if noidroid branch "shift@$last" --fail x --label nope 2>refused.txt; then
            echo "branching past an irreversible effect must be refused"; exit 1
          fi
          grep -q "irreversible" refused.txt

          # The Stand profile is pure output, so it either prints or it does not.
          noidroid stand | tee stand.txt
          grep -q "PARANOID ANDROID" stand.txt
          grep -q "DESTRUCTIVE POWER" stand.txt

          # The viewer needs a terminal, so give it one, ask it to quit, and check it
          # both drew the panes and left cleanly rather than wedging the session.
          printf 'q' | timeout 20 script -qec "stty rows 30 cols 120; noidroid tui" \
            /dev/null > tui.txt 2>&1
          sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' -e 's/\x1b\[?[0-9]*[a-z]//g' tui.txt \
            | tr -d '\000' > tui.plain
          grep -q "PARANOID ANDROID" tui.plain
          grep -q "TRAJECTORIES" tui.plain
          grep -q "TIMELINE" tui.plain
