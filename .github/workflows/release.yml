name: Release

# Tags are the release trigger: nothing is published except from an annotated
# `vX.Y.Z` tag on a commit that already passed CI on main.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  checks: read

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: gate the tag on what CI already proved
    runs-on: ubuntu-latest
    steps:
      # The whole history, and the tags: the gate asks whether this commit is an
      # ancestor of origin/main, which a shallow clone cannot answer.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: The tag must be on main, match Cargo.toml, and have passed CI
        env:
          GH_TOKEN: ${{ github.token }}
        run: .github/scripts/verify-tag.sh

  build:
    name: ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos-latest
            target: aarch64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - run: rustup target add ${{ matrix.target }}
      - run: cargo build --release --target ${{ matrix.target }} -p noidroid-cli
      - name: Package
        run: |
          set -euo pipefail
          name="noidroid-${GITHUB_REF_NAME}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp "target/${{ matrix.target }}/release/noidroid" "dist/$name/"
          cp README.md LICENSE manifesto.md "dist/$name/"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          # Written from inside dist/ so the file names itself alone. With a path
          # in it, `sha256sum -c` fails wherever the artifact is unpacked.
          ( cd dist && shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256" )
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz*

  publish:
    name: publish the release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Extract this version's changelog section
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Paranoid Android $GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*.tar.gz dist/*.sha256
