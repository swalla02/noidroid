name: Issue link

# The workflow exists so the rule does not depend on anyone remembering it: a pull
# request is where a change lands, and the issue is where the reasoning lives. One
# without the other leaves a repository whose history cannot be read back.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

jobs:
  linked:
    name: pull request closes an issue
    runs-on: ubuntu-latest
    steps:
      - name: Check the body for a closing reference
        env:
          BODY: ${{ github.event.pull_request.body }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          set -euo pipefail
          # GitHub's own closing keywords, so the link is real rather than cosmetic.
          if printf '%s' "$BODY" | grep -qiE '(close[sd]?|fix(e[sd])?|resolve[sd]?) +#[0-9]+'; then
            echo "linked ✓"
            exit 0
          fi
          # Dependabot opens its own PRs and has no issue to close.
          if [ "$AUTHOR" = "dependabot[bot]" ]; then
            echo "dependabot — exempt"
            exit 0
          fi
          echo "::error::This pull request does not close an issue."
          echo "Add 'Closes #N' to the description. If there is no issue yet, open one"
          echo "first — the issue is where the reasoning lives, the PR is where it lands."
          exit 1
